<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Clone - Library</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body>
    <div class="container">
        <!-- Sidebar Navigation -->
        <nav class="sidebar">
            <div class="logo"><i class="fab fa-spotify"></i> <span>Spotify</span></div>
            <ul>
                <li><a href="index.html"><i class="fa fa-home"></i> Home</a></li>
                <li><a href="search.html"><i class="fa fa-search"></i> Search</a></li>
                <li><a href="library.html"><i class="fa fa-book"></i> Your Library</a></li>
            </ul>
        </nav>

            <!-- Main Library Content -->
<main class="main-content">
    <h2>Your Library</h2>
    
    <iframe allow="autoplay *; encrypted-media *; fullscreen *; clipboard-write" 
            frameborder="0" height="371" 
            style="width:100%; max-width:660px; overflow:hidden; border-radius:10px;" 
            sandbox="allow-forms allow-popups allow-same-origin allow-scripts allow-storage-access-by-user-activation allow-top-navigation-by-user-activation" 
            src="https://apple.com">
    </iframe>
</main>


    <!-- The Logic to Make it Play -->
    <script>
        const player = new Audio();
        const masterPlay = document.getElementById('masterPlay');
        const songCards = document.querySelectorAll('.song-card');

        songCards.forEach(card => {
            card.addEventListener('click', () => {
                const src = card.getAttribute('data-src');
                player.src = src;
                player.play();
                // Changes play icon to pause when song starts
                masterPlay.classList.replace('fa-play-circle', 'fa-pause-circle');
            });
        });

        // Controls the big play/pause button at the bottom
        masterPlay.addEventListener('click', () => {
            if (player.paused || player.currentTime <= 0) {
                player.play();
                masterPlay.classList.replace('fa-play-circle', 'fa-pause-circle');
            } else {
                player.pause();
                masterPlay.classList.replace('fa-pause-circle', 'fa-play-circle');
            }
        });
    </script>
</body>
</html>
