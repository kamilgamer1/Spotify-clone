<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Clone - Library</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body>
    <div class="container">
        <!-- Sidebar (Same as Index) -->
        <nav class="sidebar">
            <div class="logo"><i class="fab fa-spotify"></i> <span>Spotify</span></div>
            <ul>
                <li><a href="index.html"><i class="fa fa-home"></i> Home</a></li>
                <li><a href="search.html"><i class="fa fa-search"></i> Search</a></li>
                <li><a href="library.html"><i class="fa fa-book"></i> Your Library</a></li>
            </ul>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <h2>Your Library</h2>
            <div class="card-container">
                
                <!-- SONG CARD: Copy this block for every new song you add! -->
                <div class="card song-card" data-src="songs/song1.mp3">
                    <img src="https://placeholder.com" alt="Cover">
                    <h3>Song Name 1</h3>
                    <p>Artist Name</p>
                </div>

                <div class="card song-card" data-src="songs/song2.mp3">
                    <img src="https://placeholder.com" alt="Cover">
                    <h3>Song Name 2</h3>
                    <p>Artist Name</p>
                </div>

            </div>
        </main>

        <!-- Music Player at Bottom -->
        <footer class="player">
            <div class="player-controls">
                <i class="fa fa-play-circle fa-3x" id="masterPlay"></i>
            </div>
        </footer >
    </div>

    <!-- The "Brain" to make it play -->
    <script>
        const player = new Audio();
        const masterPlay = document.getElementById('masterPlay');
        const songCards = document.querySelectorAll('.song-card');

        songCards.forEach(card => {
            card.addEventListener('click', () => {
                const src = card.getAttribute('data-src');
                player.src = src;
                player.play();
                masterPlay.classList.replace('fa-play-circle', 'fa-pause-circle');
            });
        });

        masterPlay.addEventListener('click', () => {
            if (player.paused || player.currentTime <= 0) {
                player.play();
                masterPlay.classList.replace('fa-play-circle', 'fa-pause-circle');
            } else {
                player.pause();
                masterPlay.classList.replace('fa-pause-circle', 'fa-play-circle');
            }
        });
    </script>
</body>
</html>
